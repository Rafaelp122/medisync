# Stage B estrito (ADR-001): camadas hexagonais + composition roots.
# presentation -> application + composition + core
# composition -> application + domain + infrastructure + core
# infrastructure -> application + domain + core
# application -> domain + core | domain -> core
# worker -> core + queue/billing camadas
interfaces = []
exact = false
forbid_circular_dependencies = true
source_roots = ["."]

[[modules]]
path = "src.core"
depends_on = []

[[modules]]
path = "src.modules.auth.domain"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.auth.application"
depends_on = ["src.core", "src.modules.auth.domain"]

[[modules]]
path = "src.modules.auth.infrastructure"
depends_on = ["src.core", "src.modules.auth.application", "src.modules.auth.domain"]

[[modules]]
path = "src.modules.auth.composition"
depends_on = ["src.core", "src.modules.auth.application", "src.modules.auth.domain", "src.modules.auth.infrastructure"]

[[modules]]
path = "src.modules.auth.presentation"
depends_on = ["src.core", "src.modules.auth.application", "src.modules.auth.composition"]

[[modules]]
path = "src.modules.billing.domain"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.billing.application"
depends_on = ["src.core", "src.modules.billing.domain"]

[[modules]]
path = "src.modules.billing.infrastructure"
depends_on = ["src.core", "src.modules.billing.application", "src.modules.billing.domain"]

[[modules]]
path = "src.modules.consultation.domain"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.consultation.application"
depends_on = ["src.core", "src.modules.consultation.domain"]

[[modules]]
path = "src.modules.consultation.infrastructure"
depends_on = ["src.core", "src.modules.consultation.application", "src.modules.consultation.domain"]

[[modules]]
path = "src.modules.consultation.composition"
depends_on = ["src.core", "src.modules.consultation.application", "src.modules.consultation.domain", "src.modules.consultation.infrastructure"]

[[modules]]
path = "src.modules.consultation.presentation"
depends_on = ["src.core", "src.modules.consultation.application", "src.modules.consultation.composition"]

[[modules]]
path = "src.modules.identity.domain"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.identity.application"
depends_on = ["src.core", "src.modules.identity.domain"]

[[modules]]
path = "src.modules.identity.composition"
depends_on = ["src.core", "src.modules.identity.application", "src.modules.identity.domain"]

[[modules]]
path = "src.modules.identity.presentation"
depends_on = ["src.core", "src.modules.identity.application", "src.modules.identity.composition"]

[[modules]]
path = "src.modules.queue.domain"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.queue.application"
depends_on = ["src.core", "src.modules.queue.domain"]

[[modules]]
path = "src.modules.queue.infrastructure"
depends_on = ["src.core", "src.modules.queue.application", "src.modules.queue.domain"]

[[modules]]
path = "src.modules.queue.composition"
depends_on = ["src.core", "src.modules.queue.application", "src.modules.queue.domain", "src.modules.queue.infrastructure"]

[[modules]]
path = "src.modules.queue.presentation"
depends_on = ["src.core", "src.modules.queue.application", "src.modules.queue.composition"]

[[modules]]
path = "src.modules.triage.domain"
depends_on = ["src.core"]

