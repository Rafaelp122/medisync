# Stage A (baseline routers-di, ADR-001/ADR-008): só fronteiras inter-módulos,
# sem checagem de camadas (presentation/application/domain/infrastructure).
# Stage B estrito guardado em scratch/tach_stageB.toml; será restaurado na Fase 1+.
interfaces = []
exact = false
forbid_circular_dependencies = true
source_roots = ["."]

[[modules]]
path = "src.core"
depends_on = []

[[modules]]
path = "src.modules.auth"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.billing"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.consultation"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.identity"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.queue"
depends_on = ["src.core"]

[[modules]]
path = "src.modules.triage"
depends_on = ["src.core"]

[[modules]]
path = "src.worker"
depends_on = ["src.core", "src.modules.queue", "src.modules.billing"]
