name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality (Lint, Typecheck & Tach)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Strict typecheck (Basedpyright)
        run: uv run basedpyright

      - name: Check modular boundaries (Tach)
        run: uv run tach check

  unit-tests:
    name: Unit & Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and architecture test suite
        run: uv run pytest tests/unit tests/architecture -n auto --cov=src --cov-report=term-missing

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: medisync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
