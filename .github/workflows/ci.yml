name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality (Lint, Typecheck & Tach)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Strict typecheck (Basedpyright)
        run: uv run basedpyright

      - name: Check modular boundaries (Tach)
        run: uv run tach check

  unit-tests:
    name: Unit & Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and architecture test suite
        run: uv run pytest tests/unit tests/architecture -n auto --cov=src --cov-report=term-missing

  frontend-quality:
    name: Frontend Quality (Lint, Types & OpenAPI Sync)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies (for OpenAPI export)
        run: uv sync --frozen

      - name: Export OpenAPI schema
        run: uv run python -c "import json; from src.main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate OpenAPI contracts parity (Hey API)
        run: |
          pnpm --dir frontend generate:api
          git diff --exit-code frontend/src/api/generated || (echo "Erro: Os contratos tipados em frontend/src/api/generated estão desatualizados. Execute 'just frontend-generate' localmente." && exit 1)

      - name: Check types and lint
        run: pnpm --dir frontend run check

  frontend-tests:
    name: Frontend Component & Screen Tests
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run screen & component tests (Vitest + MSW v2)
        run: pnpm --dir frontend test

  frontend-e2e:
    name: Frontend End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browsers with OS dependencies
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run E2E tests (Playwright + Axe-core WCAG 2.1 AA)
        run: pnpm --dir frontend test:e2e

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          tags: medisync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

