name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter path changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic.ini'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            frontend:
              - 'frontend/**'
              - 'openapi.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'scripts/**'
              - 'AGENTS.md'

  code-quality:
    name: Code Quality (Lint, Typecheck, Tach & Audits)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python & uv
        uses: ./.github/actions/setup-python-uv

      - name: Check documentation integrity & SSOT
        run: uv run python scripts/docs_check.py

      - name: Audit Clean Code for AI agents
        run: uv run python scripts/audit_ai_clean_code.py

      - name: Audit frontend guidelines
        run: uv run python scripts/audit_frontend_guidelines.py

      - name: Check formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Strict typecheck (Basedpyright)
        run: uv run basedpyright

      - name: Check modular boundaries (Tach)
        run: uv run tach check

  database-migrations:
    name: Database Migrations & Drift Check (Alembic)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medisync
          POSTGRES_USER: medisync
          POSTGRES_PASSWORD: medisync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: medisync
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: medisync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python & uv
        uses: ./.github/actions/setup-python-uv

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Check for migration drift (Alembic check)
        run: uv run alembic check

  unit-tests:
    name: Unit & Architecture Tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python & uv
        uses: ./.github/actions/setup-python-uv

      - name: Run unit and architecture test suite
        run: uv run pytest tests/unit tests/architecture -n auto --cov=src --cov-report=term-missing

  frontend-quality:
    name: Frontend Quality (Lint, Types & OpenAPI Sync)
    needs: [detect-changes]
    if: (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true') && hashFiles('frontend/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python & uv (for OpenAPI export)
        uses: ./.github/actions/setup-python-uv

      - name: Export OpenAPI schema
        run: uv run python -c "import json; from src.main import app; print(json.dumps(app.openapi(), indent=2))" > openapi.json

      - name: Set up Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate OpenAPI contracts parity (Hey API)
        run: |
          pnpm --dir frontend generate:api
          git diff --exit-code frontend/src/api/generated || (echo "Erro: Os contratos tipados em frontend/src/api/generated estão desatualizados. Execute 'just frontend-generate' localmente." && exit 1)

      - name: Check types and lint
        run: pnpm --dir frontend run check

  frontend-tests:
    name: Frontend Component & Screen Tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true' && hashFiles('frontend/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run screen & component tests (Vitest + MSW v2)
        run: pnpm --dir frontend test

  frontend-e2e:
    name: Frontend End-to-End Tests (Playwright)
    needs: [detect-changes]
    if: (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true') && hashFiles('frontend/package.json') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers with OS dependencies
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run E2E tests (Playwright + Axe-core WCAG 2.1 AA)
        run: pnpm --dir frontend test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Build & Smoke Test
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: medisync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production container
        run: |
          container_name="medisync-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker logs "$container_name" || true; docker rm -f "$container_name" > /dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" --publish 8080:8080 \
            --env PORT=8080 \
            --env VALKEY_RETRY_ATTEMPTS=0 \
            --env VALKEY_CONNECT_TIMEOUT=1.0 \
            medisync:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then
              echo "✅ Production container healthy and responded on /healthz!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Production container healthcheck timed out after 30 seconds."
          exit 1

