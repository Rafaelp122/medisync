services:
  postgres:
    image: postgres:17-alpine
    container_name: medisync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medisync}
      POSTGRES_DB: ${POSTGRES_DB:-medisync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/01-init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-medisync} -d $${POSTGRES_DB:-medisync}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: medisync-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  livekit:
    image: livekit/livekit-server:latest
    container_name: medisync-livekit
    restart: unless-stopped
    command: --dev
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: medisync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medisync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medisync123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: medisync-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medisync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medisync123}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-medisync-docs}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-medisync} $${MINIO_ROOT_PASSWORD:-medisync123} &&
        mc mb --ignore-existing local/$${MINIO_DEFAULT_BUCKET:-medisync-docs} &&
        echo "MinIO default bucket ready" &&
        exit 0
    restart: "no"

  backend:
    build:
      context: .
      target: development
    image: medisync:dev
    container_name: medisync-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-key-change-in-production-min-32-chars}
      - POSTGRES_USER=${POSTGRES_USER:-medisync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-medisync}
      - POSTGRES_DB=${POSTGRES_DB:-medisync}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-medisync}:${POSTGRES_PASSWORD:-medisync}@postgres:5432/${POSTGRES_DB:-medisync}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_URL=valkey://valkey:6379/0
      - LIVEKIT_HOST=livekit
      - LIVEKIT_PORT=7880
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-medisync}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-medisync123}
      - S3_BUCKET_NAME=${MINIO_DEFAULT_BUCKET:-medisync-docs}
      - S3_USE_SSL=false
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  valkey_data:
  minio_data:

networks:
  default:
    name: medisync-network
